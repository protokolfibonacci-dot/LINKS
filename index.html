  #sound {

    right: 22px;
    bottom: 22px;
    z-index: 3;
    background: #060606;
    border: 1px solid #2a2a2a;
    color: #bdbdbd;
    font: 12px 'JetBrains Mono', 'Courier New', monospace;

    padding: 12px 16px;

  #sound:hover { border-color: #8a0f0f; color: #e6e6e6; }
  #sound.hint { animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0%, 100% { border-color: #2a2a2a; }
    50% { border-color: #8a0f0f; }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

  #intro.fade { opacity: 0; pointer-events: none; }
  #killText {

  #enterHint {

  #enterHint.show { animation: blink .7s ease-in-out infinite; }
  @keyframes blink {

<button id="sound" type="button">SOUND: OFF</button>
<audio id="music" src="assets/music.mp3" preload="auto"></audio>

<script>
  var audio = document.getElementById('music');
  var btn = document.getElementById('sound');
  var intro = document.getElementById('intro');
  var kill = document.getElementById('killText');
  var hint = document.getElementById('enterHint');
  var started = false;
  audio.volume = 0.24;
  btn.classList.add('hint');

  var phrase = 'kill em all';
  var ti = 0;
  var typer = setInterval(function () {
    ti++;
    kill.textContent = phrase.slice(0, ti);
    if (ti >= phrase.length) {
      clearInterval(typer);
      setTimeout(function () { hint.classList.add('show'); }, 350);
    }
  }, 110);

  function enterSite() {
    if (!intro) return;
    var node = intro;
    intro = null;
    node.classList.add('fade');
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, 700);
    begin();
  }
  intro.addEventListener('click', enterSite);
  window.addEventListener('keydown', function (e) {
    if (intro && (e.key === 'Enter' || e.key === ' ')) enterSite();
  });

  function begin() {
    if (!started) {
      audio.currentTime = 21;
      started = true;
    }
    var p = audio.play();
    if (p && p.catch) p.catch(function () {});
  }

  function unarm() {
    window.removeEventListener('pointerdown', gestureStart, true);
    window.removeEventListener('keydown', gestureStart, true);
    window.removeEventListener('touchstart', gestureStart, true);
  }

  function gestureStart(e) {
    if (btn.contains(e.target)) return;
    if (!audio.paused) { unarm(); return; }
    begin();
  }

  audio.addEventListener('play', function () {
    unarm();
    btn.textContent = 'SOUND: ON';
    btn.classList.remove('hint');
  });
  audio.addEventListener('pause', function () {
    btn.textContent = 'SOUND: OFF';
    btn.classList.add('hint');
  });
  audio.addEventListener('ended', function () {
    audio.currentTime = 21;
    audio.play();
  });

  window.addEventListener('pointerdown', gestureStart, true);
  window.addEventListener('keydown', gestureStart, true);
  window.addEventListener('touchstart', gestureStart, true);
  begin();

  btn.addEventListener('click', function () {
    if (audio.paused) begin();
    else audio.pause();
  });
</script>
